{% for book in books %}
<tr>
    <td>{{ book.title }}</td>
    <td>{{ book.author }}</td>
    <td>{{ book.quantity }}</td>
    <td>
        <a href="{% url 'request_borrow' book.id %}" class="btn-borrow">
            Request Borrow
        </a>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="4">No books available.</td>
</tr>
{% endfor %}
