<div id="userDashboard" class="page">
    <header class="dashboard-header">
        <div class="container">
            <div class="header-content">
                <div class="header-left">
                    <div class="header-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1>Digital Library ✨</h1>
                        <p class="header-subtitle">Welcome, <span id="userUsername"></span></p>
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="logout()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </button>
            </div>
        </div>
    </header>

    <div class="stats-bar">
        <div class="container">
            <div class="stats-grid">
                <div class="stat-card stat-blue">
                    <div class="stat-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <p class="stat-label">Total Books</p>
                        <p class="stat-value" id="totalBooksCount">0</p>
                    </div>
                </div>
                
                <div class="stat-card stat-green">
                    <div class="stat-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                        </svg>
                    </div>
                    <div>
                        <p class="stat-label">Available</p>
                        <p class="stat-value" id="availableBooksCount">0</p>
                    </div>
                </div>
                
                <div class="stat-card stat-purple">
                    <div class="stat-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                            <line x1="10" y1="7" x2="8" y2="7"></line>
                            <line x1="16" y1="7" x2="8" y2="7"></line>
                        </svg>
                    </div>
                    <div>
                        <p class="stat-label">My Books</p>
                        <p class="stat-value" id="myBooksCount">0</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tabs-container">
        <div class="container">
            <div class="tabs">
                <button class="tab active" data-tab="search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    Search & Borrow Books
                </button>
                <button class="tab" data-tab="borrowed">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        <line x1="10" y1="7" x2="8" y2="7"></line>
                    </svg>
                    My Borrowed Books
                    <span class="badge" id="borrowedBadge" style="display: none;">0</span>
                </button>
            </div>
        </div>
    </div>

    <main class="container main-content">
        <!-- Search Tab -->
        <div id="searchTab" class="tab-content active">
            <div class="search-section">
                <h2 class="section-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    Search Books
                </h2>
                
                <div class="search-filters">
                    <button class="filter-btn active" data-search="title">Search by Title</button>
                    <button class="filter-btn" data-search="author">Search by Author</button>
                </div>
                
                <div class="search-input-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search by title...">
                </div>
            </div>
            
            <h2 class="section-title">
                ✨ Available Books (<span id="availableCount">0</span>)
            </h2>
            <div id="availableBooksGrid" class="books-grid"></div>
        </div>

        <!-- Borrowed Tab -->
        <div id="borrowedTab" class="tab-content">
            <h2 class="section-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                My Borrowed Books (<span id="borrowedCount">0</span>)
            </h2>
            <div id="borrowedBooksGrid" class="books-grid"></div>
        </div>
    </main>
</div>
