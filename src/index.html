<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="page active">
        <div class="login-container">
            <div class="animated-bg">
                <div class="bg-circle bg-circle-1"></div>
                <div class="bg-circle bg-circle-2"></div>
            </div>
            
            <div class="login-card">
                <div class="login-header">
                    <div class="rotating-bg rotating-bg-1"></div>
                    <div class="rotating-bg rotating-bg-2"></div>
                    
                    <div class="login-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                    </div>
                    
                    <h1>Digital Library System ✨</h1>
                    <p>Welcome back! Please login to continue</p>
                </div>
                
                <div class="login-body">
                    <form id="loginForm">
                        <div class="form-group">
                            <label>Login As</label>
                            <div class="role-buttons">
                                <button type="button" class="role-btn active" data-role="user">User</button>
                                <button type="button" class="role-btn" data-role="admin">Admin</button>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="username">Username</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                <input type="text" id="username" placeholder="Enter your username" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input type="password" id="password" placeholder="Enter your password" required>
                            </div>
                        </div>
                        
                        <div id="loginError" class="error-message" style="display: none;"></div>
                        
                        <button type="submit" class="btn btn-primary btn-full">Login</button>
                    </form>
                    
                    <div class="demo-credentials">
                        <p class="demo-title">✨ Demo Credentials:</p>
                        <p><strong>User:</strong> any username / user123</p>
                        <p><strong>Admin:</strong> any username / admin123</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Placeholder for dynamically loaded dashboards -->
    <div id="dashboard-container"></div>

    <!-- Review Modal -->
    <div id="reviewModal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <button class="modal-close" onclick="closeReviewModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <h2 id="modalBookTitle"></h2>
                <p id="modalBookAuthor"></p>
                <div class="modal-rating">
                    <div class="stars" id="modalStars"></div>
                    <span id="modalRatingText"></span>
                    <span id="modalReviewCount"></span>
                </div>
            </div>
            
            <div class="modal-body">
                <div class="book-description">
                    <h3>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        Description
                    </h3>
                    <p id="modalDescription"></p>
                </div>
                
                <div class="reviews-section">
                    <div class="reviews-header">
                        <h3>Reviews (<span id="reviewsCount">0</span>)</h3>
                        <button class="btn btn-primary btn-sm" id="writeReviewBtn" onclick="showReviewForm()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                            Write a Review
                        </button>
                    </div>
                    
                    <form id="reviewForm" class="review-form" style="display: none;">
                        <div class="form-group">
                            <label>Your Rating</label>
                            <div class="star-rating" id="userRating">
                                <span class="star" data-rating="1">★</span>
                                <span class="star" data-rating="2">★</span>
                                <span class="star" data-rating="3">★</span>
                                <span class="star" data-rating="4">★</span>
                                <span class="star" data-rating="5">★</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="reviewComment">Your Review</label>
                            <textarea id="reviewComment" placeholder="Share your thoughts about this book..." rows="4" required></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="hideReviewForm()">Cancel</button>
                            <button type="submit" class="btn btn-primary btn-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                                Submit Review
                            </button>
                        </div>
                    </form>
                    
                    <div id="reviewsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
